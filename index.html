<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kerem - Kişisel Web Sitem</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background-color: #16213e;
            padding: 2.5rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #e94560;
            margin-bottom: 1rem;
            object-fit: cover;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            color: #fff;
        }
        p {
            color: #a2a8d3;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 1.5rem;
        }
        .social-links {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn {
            background-color: #0f3460;
            color: #fff;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
            border: 1px solid #e94560;
        }
        .btn:hover {
            background-color: #e94560;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Profil Fotoğrafı (Kendi resim URL'niz ile değiştirebilirsiniz) -->
        <img src="https://picsum.photos/200" alt="Profil Fotoğrafı" class="profile-img">
        
        <h1>Kerem</h1>
        <p>Web geliştirme dünyasına adım atıyorum. Projelerimi ve sosyal medya hesaplarımı buradan takip edebilirsiniz!</p>

        <div class="social-links">
            <a href="https://github.com/kerembakay423-blip" target="_blank" class="btn">GitHub Profilim</a>
            <a href="https://instagram.com" target="_blank" class="btn">Instagram</a>
            <a href="mailto:ornek@email.com" class="btn">Bana Ulaşın</a>
        </div>
    </div>

</body>
</html>
