<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1 Euro Katlama Simülatörü</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      background: #0d1117; color: #c9d1d9;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; margin: 0; padding: 20px;
    }
    .card {
      background: #161b22; border: 1px solid #30363d;
      padding: 25px; border-radius: 16px;
      width: 100%; max-width: 480px; text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h1 { color: #58a6ff; margin-top: 0; font-size: 24px; }
    .balance-box {
      background: #21262d; border: 2px solid #238636;
      border-radius: 12px; padding: 15px; margin: 15px 0;
    }
    .balance-title { font-size: 14px; color: #8b949e; margin-bottom: 5px; }
    .balance-amount { font-size: 32px; font-weight: bold; color: #2ea043; }
    
    .section {
      background: #21262d; border-radius: 10px;
      padding: 15px; margin-bottom: 12px; text-align: left;
    }
    .section-title { font-weight: bold; color: #f0f6fc; margin-bottom: 10px; font-size: 15px; }
    
    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
    button {
      flex: 1; min-width: 45%; padding: 10px;
      border: none; border-radius: 6px; font-weight: bold;
      cursor: pointer; transition: 0.2s; font-size: 13px;
    }
    .btn-primary { background: #238636; color: #fff; }
    .btn-primary:hover { background: #2ea043; }
    .btn-risk { background: #da3633; color: #fff; }
    .btn-risk:hover { background: #f85149; }
    .btn-biz { background: #1f6feb; color: #fff; }
    .btn-biz:hover { background: #388bfd; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .log {
      background: #0d1117; border: 1px solid #30363d;
      border-radius: 6px; padding: 10px; height: 80px;
      overflow-y: auto; font-size: 12px; font-family: monospace;
      color: #8b949e; text-align: left; margin-top: 15px;
    }
    .log-item { margin-bottom: 4px; }
    .success { color: #3fb950; }
    .danger { color: #f85149; }
  </style>
</head>
<body>

<div class="card">
  <h1>💶 1 Euro Katlama Simülatörü</h1>
  
  <div class="balance-box">
    <div class="balance-title">Cüzdandaki Paranız</div>
    <div class="balance-amount"><span id="money">1.00</span> €</div>
  </div>

  <!-- 1. Küçük Ticaret -->
  <div class="section">
    <div class="section-title">🛒 Pazarda Katlama (Sıfır Risk)</div>
    <div class="btn-group">
      <button class="btn-primary" id="btn-water" onclick="doTrade('water', 1, 1.5, 'Su sattın')">Su Sat (1€ ➔ 1.5€)</button>
      <button class="btn-primary" id="btn-coffee" onclick="doTrade('coffee', 5, 8, 'Kahve sattın')" disabled>Kahve Sat (5€ ➔ 8€)</button>
    </div>
  </div>

  <!-- 2. Risk Yolu -->
  <div class="section">
    <div class="section-title">🎲 Şans / Risk (2x ya da Kaybet)</div>
    <div class="btn-group">
      <button class="btn-risk" onclick="gamble(0.5)">Paranın Yarısını Katla (%50)</button>
      <button class="btn-risk" onclick="gamble(1.0)">HEPSİNİ Katla (%50)</button>
    </div>
  </div>

  <!-- 3. Pasif Gelir -->
  <div class="section">
    <div class="section-title">🏢 Otomatik Gelir (Saniyede Kazan)</div>
    <div class="btn-group">
      <button class="btn-biz" id="btn-stand" onclick="buyBusiness('stand', 20, 0.5, 'Limon tezgahı')" disabled>Limon Tezgâhı (20€) [+0.5€/s]</button>
      <button class="btn-biz" id="btn-shop" onclick="buyBusiness('shop', 100, 3, 'Büfe')" disabled>Büfe Aç (100€) [+3€/s]</button>
    </div>
  </div>

  <div class="log" id="logBox">
    <div class="log-item">Cebinde 1 Euro ile başladın. Başarılar!</div>
  </div>
</div>

<script>
  let money = 1.00;
  let incomePerSec = 0;

  function updateUI() {
    document.getElementById('money').innerText = money.toFixed(2);
    
    // Buton durumlarını paraya göre güncelle
    document.getElementById('btn-water').disabled = money < 1;
    document.getElementById('btn-coffee').disabled = money < 5;
    document.getElementById('btn-stand').disabled = money < 20;
    document.getElementById('btn-shop').disabled = money < 100;

    if (money <= 0) {
      log("İflas ettin! Oyuna yeniden başlamak için sayfayı yenile.", "danger");
    }
  }

  function log(msg, type = "") {
    const box = document.getElementById('logBox');
    const div = document.createElement('div');
    div.className = `log-item ${type}`;
    div.innerText = `> ${msg}`;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  function doTrade(item, cost, returnVal, name) {
    if (money >= cost) {
      money -= cost;
      const profit = returnVal;
      money += profit;
      log(`${name}! Net Kar: +${(returnVal - cost).toFixed(2)}€`, "success");
      updateUI();
    }
  }

  function gamble(ratio) {
    if (money <= 0) return;
    const bet = money * ratio;
    const win = Math.random() < 0.5;

    if (win) {
      money += bet;
      log(`RİSK TUTTU! +${bet.toFixed(2)}€ kazandın.`, "success");
    } else {
      money -= bet;
      log(`RİSK BATTI! -${bet.toFixed(2)}€ kaybettin.`, "danger");
    }
    updateUI();
  }

  function buyBusiness(type, cost, cps, name) {
    if (money >= cost) {
      money -= cost;
      incomePerSec += cps;
      log(`${name} satın aldın! Saniyede +${cps}€ kazanıyorsun.`, "success");
      updateUI();
    }
  }

  // Pasif Gelir Döngüsü
  setInterval(() => {
    if (incomePerSec > 0 && money > 0) {
      money += incomePerSec;
      updateUI();
    }
  }, 1000);

  updateUI();
</script>

</body>
</html>
