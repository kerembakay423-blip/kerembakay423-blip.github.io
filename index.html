<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FİDA 2027</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #008b8b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 3px solid #00d2d3;
            padding-bottom: 10px;
            width: 100%;
            max-width: 800px;
        }

        h1 {
            font-size: 2.8rem;
            color: #00a8a8;
            letter-spacing: 2px;
            text-shadow: 0px 2px 4px rgba(0,210,211,0.2);
        }

        .subtitle {
            font-size: 1rem;
            color: #55e6c1;
            font-weight: bold;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background-color: #f7ffff;
            border: 2px solid #00d2d3;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 20px rgba(0, 210, 211, 0.15);
        }

        /* İSİM GİRİŞ EKRANI */
        #login-section {
            text-align: center;
            padding: 20px 0;
        }

        .input-group {
            margin: 20px 0;
        }

        input[type="text"] {
            width: 80%;
            max-width: 350px;
            padding: 12px 18px;
            font-size: 1.1rem;
            border: 2px solid #00d2d3;
            border-radius: 25px;
            outline: none;
            color: #005b5b;
            text-align: center;
            background-color: #ffffff;
        }

        input[type="text"]:focus {
            border-color: #00a8a8;
            box-shadow: 0 0 8px rgba(0, 210, 211, 0.5);
        }

        .btn {
            background-color: #00d2d3;
            color: #ffffff;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 210, 211, 0.3);
        }

        .btn:hover {
            background-color: #00a8a8;
            transform: translateY(-2px);
        }

        /* TEKLİF EKRANI */
        #offers-section {
            display: none;
        }

        .welcome-msg {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.2rem;
            color: #005b5b;
        }

        .offers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }

        .club-card {
            background: #ffffff;
            border: 2px solid #e0ffff;
            border-top: 5px solid #00d2d3;
            border-radius: 12px;
            padding: 18px;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
        }

        .club-card:hover {
            transform: translateY(-5px);
            border-color: #00d2d3;
            box-shadow: 0 8px 15px rgba(0, 210, 211, 0.2);
        }

        .club-badge {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            margin: 0 auto 10px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            color: #fff;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
        }

        .club-name {
            font-size: 1.3rem;
            color: #005b5b;
            margin-bottom: 8px;
        }

        .club-info {
            font-size: 0.85rem;
            color: #555;
            text-align: left;
            margin: 10px 0;
            line-height: 1.6;
            background-color: #f0ffff;
            padding: 8px 12px;
            border-radius: 8px;
        }

        .club-info strong {
            color: #008b8b;
        }

        /* SEÇİLEN TAKIM EKRANI */
        #game-dashboard {
            display: none;
            text-align: center;
        }

        .selected-box {
            background-color: #ffffff;
            border: 3px solid #00d2d3;
            border-radius: 12px;
            padding: 25px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <header>
        <h1>FİDA 2027</h1>
        <div class="subtitle">FUTBOL MENAJERLİK KARİYERİ</div>
    </header>

    <div class="container">
        
        <!-- 1. ADIM: İSİM GİRİŞİ -->
        <div id="login-section">
            <h2>Menajer Kaydı</h2>
            <p style="margin-top: 8px; color: #666;">Kariyerine başlamak için adını gir:</p>
            <div class="input-group">
                <input type="text" id="manager-name" placeholder="Menajer Adı Soyadı" autocomplete="off">
            </div>
            <button class="btn" onclick="startCareer()">Kariyere Başla</button>
        </div>

        <!-- 2. ADIM: TEKLİFLER -->
        <div id="offers-section">
            <div class="welcome-msg">
                Hoş geldin <strong id="display-name" style="color: #00a8a8;"></strong>! Sana teklif gönderen kulüpler aşağıda:
            </div>
            <div class="offers-grid" id="clubs-container"></div>
        </div>

        <!-- 3. ADIM: SEÇİLEN KULÜP EKRANI (DEVAMI İÇİN HAZIR ALAN) -->
        <div id="game-dashboard">
            <h2 style="color: #005b5b;">Kariyer Başladı!</h2>
            <div class="selected-box" id="selected-club-info"></div>
        </div>

    </div>

    <script>
        // KULÜPLER, LOGO RENKLERİ, TD VE OYUNCU VERİLERİ
        const clubs = [
            {
                name: "Amedspor",
                league: "Trendyol 1. Lig",
                badgeBg: "#008000", // Yeşil/Kırmızı
                badgeText: "AMD",
                td: "Ersun Yanal",
                starPlayer: "Britt Assombalonga",
                budget: "1.5M €"
            },
            {
                name: "Ipswich Town",
                league: "Premier League",
                badgeBg: "#003399", // Mavi
                badgeText: "IPS",
                td: "Kieran McKenna",
                starPlayer: "Liam Delap",
                budget: "12M €"
            },
            {
                name: "Köln",
                league: "2. Bundesliga",
                badgeBg: "#d63031", // Kırmızı/Beyaz
                badgeText: "KOE",
                td: "Gerhard Struber",
                starPlayer: "Davie Selke",
                budget: "5M €"
            },
            {
                name: "Fiorentina",
                league: "Serie A",
                badgeBg: "#6c5ce7", // Mor
                badgeText: "FIO",
                td: "Raffaele Palladino",
                starPlayer: "Moise Kean",
                budget: "15M €"
            },
            {
                name: "Getafe",
                league: "La Liga",
                badgeBg: "#0984e3", // Mavi
                badgeText: "GET",
                td: "José Bordalás",
                starPlayer: "Borja Mayoral",
                budget: "8M €"
            },
            {
                name: "Paris FC",
                league: "Ligue 2",
                badgeBg: "#1e3799", // Koyu Mavi
                badgeText: "PFC",
                td: "Stéphane Gilli",
                starPlayer: "Jean-Philippe Krasso",
                budget: "3M €"
            }
        ];

        let managerName = "";

        function startCareer() {
            const nameInput = document.getElementById("manager-name").value.trim();
            if (nameInput === "") {
                alert("Lütfen menajer adınızı girin!");
                return;
            }

            managerName = nameInput;
            document.getElementById("display-name").innerText = managerName;

            // Ekran değiştir
            document.getElementById("login-section").style.display = "none";
            document.getElementById("offers-section").style.display = "block";

            loadOffers();
        }

        function loadOffers() {
            const container = document.getElementById("clubs-container");
            container.innerHTML = "";

            clubs.forEach((club, index) => {
                const card = document.createElement("div");
                card.className = "club-card";
                card.innerHTML = `
                    <div class="club-badge" style="background-color: ${club.badgeBg}">${club.badgeText}</div>
                    <div class="club-name">${club.name}</div>
                    <div class="club-info">
                        <strong>Lig:</strong> ${club.league}<br>
                        <strong>Mevcut TD:</strong> ${club.td}<br>
                        <strong>Yıldız Oyuncu:</strong> ${club.starPlayer}<br>
                        <strong>Bütçe:</strong> ${club.budget}
                    </div>
                    <button class="btn" style="width: 100%; margin-top: 10px;" onclick="selectClub(${index})">Teklifi Kabul Et</button>
                `;
                container.appendChild(card);
            });
        }

        function selectClub(index) {
            const chosen = clubs[index];
            document.getElementById("offers-section").style.display = "none";
            document.getElementById("game-dashboard").style.display = "block";

            document.getElementById("selected-club-info").innerHTML = `
                <div class="club-badge" style="background-color: ${chosen.badgeBg}; width:80px; height:80px; font-size:1.6rem; margin-bottom:15px;">${chosen.badgeText}</div>
                <h3 style="font-size: 1.8rem; color: #008b8b;">${chosen.name}</h3>
                <p style="margin: 10px 0; color: #333;">Tebrikler <strong>${managerName}</strong>! ${chosen.name} kulübünün yeni Teknik Direktörü oldun.</p>
                <hr style="border: 1px solid #e0ffff; margin: 15px 0;">
                <p><strong>Transfer Bütçen:</strong> ${chosen.budget}</p>
                <p><strong>Takım Kaptanı / Yıldızı:</strong> ${chosen.starPlayer}</p>
                <br>
                <p style="color: #00a8a8; font-weight: bold;">(Sonraki adımlar için oyunu geliştirmeye devam edeceğiz!)</p>
            `;
        }
    </script>
</body>
</html>
