<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Futbol Penaltı Oyunu</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: #1a2a3a;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #243b55;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    h1, h2 { margin-top: 0; color: #4facfe; }
    input, select, button {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }
    input, select {
      background: #141e30;
      color: #fff;
    }
    button {
      background: #00f2fe;
      background: linear-gradient(to right, #4facfe, #00f2fe);
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }
    button:hover { opacity: 0.9; transform: scale(1.02); }
    .hidden { display: none; }
    
    /* Saha ve Oyun Alanı */
    .field {
      background: #2e7d32;
      border: 3px solid #fff;
      border-radius: 12px;
      padding: 20px;
      margin: 20px 0;
      position: relative;
    }
    .goal {
      border: 4px solid #fff;
      border-bottom: none;
      height: 80px;
      background: rgba(255,255,255,0.1);
      display: flex;
      justify-content: space-around;
      align-items: center;
      font-size: 28px;
    }
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }
    .scoreboard {
      display: flex;
      justify-content: space-between;
      background: #141e30;
      padding: 10px 15px;
      border-radius: 8px;
      margin-bottom: 15px;
    }
    .log {
      font-weight: bold;
      min-height: 24px;
      margin: 10px 0;
    }
  </style>
</head>
<body>

<div class="card">
  <!-- 1. Ekran: Oyuncu İsmi & Takım Seçimi -->
  <div id="setup-screen">
    <h1>Karakter Oluştur</h1>
    <label for="playerName">Oyuncu Adı:</label>
    <input type="text" id="playerName" placeholder="Adınızı girin..." value="Kaptan">
    
    <label for="teamSelect">Takım Seçin:</label>
    <select id="teamSelect">
      <option value="Galatasaray">Galatasaray 🦁</option>
      <option value="Fenerbahçe">Fenerbahçe 🦅</option>
      <option value="Beşiktaş">Beşiktaş 🦅</option>
      <option value="Trabzonspor">Trabzonspor 🌊</option>
      <option value="Real Madrid">Real Madrid 👑</option>
      <option value="Barcelona">Barcelona 🔵🔴</option>
    </select>
    
    <button onclick="startGame()">Saha Çık!</button>
  </div>

  <!-- 2. Ekran: Penaltı Oyunu -->
  <div id="game-screen" class="hidden">
    <div class="scoreboard">
      <div><span id="displayTeam"></span></div>
      <div>Gol: <b id="score">0</b> / <span id="shotsLeft">5</span></div>
    </div>

    <div class="field">
      <div class="goal">
        <span id="gk-position">🧤</span>
      </div>
      <p style="margin-top: 15px;">⚽ Top başındasın, **<span id="displayName"></span>**!</p>
    </div>

    <div id="statusLog" class="log">Şut çekeceğin yönü seç:</div>

    <div class="controls">
      <button onclick="shoot('Sol')">⬅️ Sol</button>
      <button onclick="shoot('Orta')">⬆️ Orta</button>
      <button onclick="shoot('Sağ')">➡️ Sağ</button>
    </div>
  </div>

  <!-- 3. Ekran: Sonuç -->
  <div id="result-screen" class="hidden">
    <h2>Maç Bitti!</h2>
    <p id="finalText"></p>
    <button onclick="resetGame()">Yeniden Oyna</button>
  </div>
</div>

<script>
  let player = { name: "", team: "" };
  let score = 0;
  let shotsLeft = 5;

  function startGame() {
    const nameInput = document.getElementById("playerName").value.trim();
    if (!nameInput) {
      alert("Lütfen bir isim girin!");
      return;
    }

    player.name = nameInput;
    player.team = document.getElementById("teamSelect").value;

    document.getElementById("displayName").innerText = player.name;
    document.getElementById("displayTeam").innerText = player.team;

    document.getElementById("setup-screen").classList.add("hidden");
    document.getElementById("game-screen").classList.remove("hidden");
  }

  function shoot(direction) {
    if (shotsLeft <= 0) return;

    const directions = ['Sol', 'Orta', 'Sağ'];
    const gkChoice = directions[Math.floor(Math.random() * directions.length)];
    const log = document.getElementById("statusLog");

    // Kaleci ikonu konumu göster
    const gkIcon = document.getElementById("gk-position");
    if (gkChoice === 'Sol') gkIcon.innerText = "🧤 🥅 🥅";
    else if (gkChoice === 'Orta') gkIcon.innerText = "🥅 🧤 🥅";
    else gkIcon.innerText = "🥅 🥅 🧤";

    shotsLeft--;
    document.getElementById("shotsLeft").innerText = shotsLeft;

    if (direction !== gkChoice) {
      score++;
      document.getElementById("score").innerText = score;
      log.innerHTML = `<span style="color: #4caf50;">GOL! 🎉 (${direction} köşeye attın, kaleci ${gkChoice}'a atladı)</span>`;
    } else {
      log.innerHTML = `<span style="color: #f44336;">KAÇTI! ❌ (Kaleci ${gkChoice} yönünü kurtardı)</span>`;
    }

    if (shotsLeft === 0) {
      setTimeout(endGame, 1200);
    }
  }

  function endGame() {
    document.getElementById("game-screen").classList.add("hidden");
    document.getElementById("result-screen").classList.remove("hidden");
    
    let text = `${player.name} (${player.team}), 5 penaltı atışından <b>${score}</b> gol attın.`;
    if (score >= 4) text += "<br>🔥 Harika bir performans, yıldız oyuncusun!";
    else if (score >= 2) text += "<br>👍 Fena değil, ama biraz daha antrenman lazım.";
    else text += "<br>😅 Bugün şansın pek yaver gitmedi.";

    document.getElementById("finalText").innerHTML = text;
  }

  function resetGame() {
    score = 0;
    shotsLeft = 5;
    document.getElementById("score").innerText = score;
    document.getElementById("shotsLeft").innerText = shotsLeft;
    document.getElementById("statusLog").innerText = "Şut çekeceğin yönü seç:";
    document.getElementById("gk-position").innerText = "🧤";

    document.getElementById("result-screen").classList.add("hidden");
    document.getElementById("setup-screen").classList.remove("hidden");
  }
</script>

</body>
</html>
