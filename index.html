<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kimlik Hırsızı - Güvenlik Terminali</title>
    <style>
        :root {
            --bg-blue: #ebf8ff;
            --primary-blue: #2563eb;
            --dark-blue: #1e3a8a;
            --light-blue: #dbeafe;
            --white: #ffffff;
            --danger-red: #ef4444;
            --success-green: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-blue);
            color: var(--dark-blue);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .terminal-container {
            background-color: var(--white);
            border: 3px solid var(--primary-blue);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.15);
            width: 100%;
            max-width: 500px;
            overflow: hidden;
        }

        .terminal-header {
            background-color: var(--primary-blue);
            color: var(--white);
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
            letter-spacing: 1px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            background-color: var(--light-blue);
            padding: 10px 20px;
            font-weight: 600;
        }

        .content {
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .visitor-card {
            background-color: var(--bg-blue);
            border: 2px dashed var(--primary-blue);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .visitor-name {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--dark-blue);
            margin-top: 5px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.9rem;
            font-weight: 600;
        }

        input[type="text"] {
            padding: 12px;
            border: 2px solid var(--light-blue);
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
            text-transform: uppercase;
        }

        input[type="text"]:focus {
            border-color: var(--primary-blue);
        }

        .analysis-box {
            background-color: var(--light-blue);
            padding: 12px;
            border-radius: 6px;
            font-size: 0.95rem;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-weight: 600;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-accept {
            background-color: var(--primary-blue);
            color: var(--white);
        }

        .btn-reject {
            background-color: var(--white);
            color: var(--danger-red);
            border: 2px solid var(--danger-red);
        }

        .btn-scan {
            background-color: var(--dark-blue);
            color: var(--white);
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

<div class="terminal-container">
    <div class="terminal-header">GÜVENLİK TERMİNALİ v1.0</div>
    
    <div class="stats-bar">
        <span>PUAN: <span id="score">0</span></span>
        <span>CAN: <span id="lives">3</span></span>
    </div>

    <div class="content">
        <div class="visitor-card">
            <small>KAPIDAKİ ZİYARETÇİ</small>
            <div class="visitor-name" id="current-visitor">...</div>
        </div>

        <div class="input-group">
            <label for="name-input">İsmi Doğrula / Tara:</label>
            <input type="text" id="name-input" placeholder="İsmi buraya yazın..." autocomplete="off">
            <button class="btn-scan" onclick="analyzeName()">SİSTEMDE TARA</button>
        </div>

        <div class="analysis-box" id="analysis-result">
            İsmi yazıp 'SİSTEMDE TARA' butonuna basın.
        </div>

        <div class="action-buttons">
            <button class="btn-accept" onclick="makeDecision(true)">KABUL ET</button>
            <button class="btn-reject" onclick="makeDecision(false)">REDDET</button>
        </div>
    </div>
</div>

<script>
    const sampleNames = ["KAYAK", "AZA", "AXZEL", "SERKAN", "MEHMET", "NILIN", "BOB", "ZARTX", "ALİ", "EFE"];
    let currentVisitorName = "";
    let score = 0;
    let lives = 3;
    let isThreat = false;

    function nextVisitor() {
        if (lives <= 0) return;
        
        currentVisitorName = sampleNames[Math.floor(Math.random() * sampleNames.length)];
        document.getElementById('current-visitor').innerText = currentVisitorName;
        document.getElementById('name-input').value = "";
        document.getElementById('analysis-result').innerText = "İsmi yazıp 'SİSTEMDE TARA' butonuna basın.";
        document.getElementById('analysis-result').style.color = "inherit";
        
        // Tehdit analizi (Gizli kural)
        let cleanName = currentVisitorName.toUpperCase();
        let reversed = cleanName.split('').reverse().join('');
        
        // Kural: Palindrom ise (Robot) VEYA içinde XZ geçiyorsa (Uzaylı) TEHDİTTİR.
        isThreat = (cleanName === reversed && cleanName.length > 1) || cleanName.includes("XZ");
    }

    function analyzeName() {
        let inputVal = document.getElementById('name-input').value.trim().toUpperCase();
        let resultBox = document.getElementById('analysis-result');

        if (inputVal === "") {
            resultBox.innerText = "Lütfen önce ismi yazın!";
            return;
        }

        let reversed = inputVal.split('').reverse().join('');

        if (inputVal === reversed && inputVal.length > 1) {
            resultBox.innerText = "UYARI: Palindrom isim! (Robot Şüphesi)";
            resultBox.style.color = "red";
        } else if (inputVal.includes("XZ")) {
            resultBox.innerText = "UYARI: Yasak kod birleşimi! (Uzaylı Şüphesi)";
            resultBox.style.color = "red";
        } else {
            resultBox.innerText = "TEMİZ: Şüpheli harf dizilimi saptanmadı.";
            resultBox.style.color = "green";
        }
    }

    function makeDecision(accepted) {
        if (lives <= 0) return;

        // Doğru karar: Tehditse reddetmek (false) veya Temizse kabul etmek (true)
        if ((isThreat && !accepted) || (!isThreat && accepted)) {
            score += 10;
            document.getElementById('score').innerText = score;
            alert("DOĞRU KARAR!");
        } else {
            lives -= 1;
            document.getElementById('lives').innerText = lives;
            alert("YANLIŞ KARAR!");
        }

        if (lives <= 0) {
            alert("OYUN BİTTİ! Toplam Puanın: " + score);
            location.reload();
        } else {
            nextVisitor();
        }
    }

    // Oyunu Başlat
    nextVisitor();
</script>

</body>
</html>
