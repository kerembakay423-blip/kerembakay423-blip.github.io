<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FİDA 2027 - Futbolcu Kariyeri</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #008b8b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 3px solid #00d2d3;
            padding-bottom: 10px;
            width: 100%;
            max-width: 900px;
        }

        h1 {
            font-size: 2.8rem;
            color: #00a8a8;
            letter-spacing: 2px;
            text-shadow: 0px 2px 4px rgba(0,210,211,0.2);
        }

        .subtitle {
            font-size: 1rem;
            color: #00d2d3;
            font-weight: bold;
        }

        .container {
            width: 100%;
            max-width: 950px;
            background-color: #f7ffff;
            border: 2px solid #00d2d3;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 20px rgba(0, 210, 211, 0.15);
        }

        #login-section {
            text-align: center;
            padding: 20px 0;
        }

        .input-group {
            margin: 20px 0;
        }

        input[type="text"] {
            width: 80%;
            max-width: 350px;
            padding: 12px 18px;
            font-size: 1.1rem;
            border: 2px solid #00d2d3;
            border-radius: 25px;
            outline: none;
            color: #005b5b;
            text-align: center;
            background-color: #ffffff;
        }

        input[type="text"]:focus {
            border-color: #00a8a8;
            box-shadow: 0 0 8px rgba(0, 210, 211, 0.5);
        }

        .btn {
            background-color: #00d2d3;
            color: #ffffff;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 210, 211, 0.3);
        }

        .btn:hover {
            background-color: #00a8a8;
            transform: translateY(-2px);
        }

        #offers-section {
            display: none;
        }

        .welcome-msg {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.2rem;
            color: #005b5b;
        }

        .offers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .club-card {
            background: #ffffff;
            border: 2px solid #e0ffff;
            border-top: 6px solid #00d2d3;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .club-card:hover {
            transform: translateY(-5px);
            border-color: #00d2d3;
            box-shadow: 0 8px 15px rgba(0, 210, 211, 0.2);
        }

        /* ÖZEL LOGO ALANI */
        .club-logo {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            margin: 0 auto 12px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
            color: #fff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            border: 3px solid #ffffff;
        }

        .club-name {
            font-size: 1.4rem;
            color: #005b5b;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .club-info {
            font-size: 0.85rem;
            color: #333;
            text-align: left;
            margin: 12px 0;
            line-height: 1.5;
            background-color: #f0ffff;
            padding: 10px 12px;
            border-radius: 8px;
            border-left: 3px solid #00d2d3;
        }

        .club-info strong {
            color: #008b8b;
        }

        .squad-box {
            display: none;
            margin-top: 10px;
            text-align: left;
            font-size: 0.78rem;
            background-color: #ffffff;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #e0ffff;
            max-height: 150px;
            overflow-y: auto;
            color: #444;
        }

        #game-dashboard {
            display: none;
            text-align: center;
        }

        .selected-box {
            background-color: #ffffff;
            border: 3px solid #00d2d3;
            border-radius: 12px;
            padding: 25px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <header>
        <h1>FİDA 2027</h1>
        <div class="subtitle">FUTBOLCU KARİYERİ MODU</div>
    </header>

    <div class="container">
        
        <!-- İSİM GİRİŞİ -->
        <div id="login-section">
            <h2>Kariyerine Başla</h2>
            <p style="margin-top: 8px; color: #666;">Oyuncu adını ve soyadını gir:</p>
            <div class="input-group">
                <input type="text" id="player-name" placeholder="Futbolcu Adı" autocomplete="off">
            </div>
            <button class="btn" onclick="startPlayerCareer()">Oyuncu Oluştur</button>
        </div>

        <!-- TEKLİFLER EKRANI -->
        <div id="offers-section">
            <div class="welcome-msg">
                Süper yetenek <strong id="display-name" style="color: #00a8a8;"></strong>! Menajerin sana gelen transfer tekliflerini sundu:
            </div>
            <div class="offers-grid" id="clubs-container"></div>
        </div>

        <!-- OYUN DAHBOARD -->
        <div id="game-dashboard">
            <h2 style="color: #005b5b;">Transfer Tamamlandı!</h2>
            <div class="selected-box" id="selected-club-info"></div>
        </div>

    </div>

    <script>
        // KULÜPLER, TEKNİK DİREKTÖRLER VE SİZİN SAĞLADIĞINIZ TAM KADROLAR
        const clubs = [
            {
                name: "Amedspor",
                td: "Besnik Hasi",
                logoBg: "linear-gradient(135deg, #008000, #d63031)",
                logoCode: "AMD",
                gk: ["Erce Kardeşler", "Abdulsamed Damlu"],
                def: ["Murat Uçar", "Mehmet Yeşil", "Kahraman Demirtaş", "Hasan Ali Kaldırım", "Celal Hanalp", "Ayaz Arslan", "Tarkan Serbest", "Oleksandr Syrota", "Oğuzhan Matur"],
                mid: ["Sinan Kurt", "Çekdar Orhan", "Adama Traore", "Dia Saba", "Atakan Müjde", "Cem Üstündağ"],
                fwd: ["Felix Afena-Gyan", "Daniel Moreno", "Mbaye Diagne", "Florent Hasani", "Emrah Başsan", "Zdravko Minchev Dimitrov", "Dilhan Demir"]
            },
            {
                name: "Ipswich Town",
                td: "Gary O'Neil",
                logoBg: "linear-gradient(135deg, #003399, #0984e3)",
                logoCode: "IPS",
                gk: ["Christian Walton", "Alex Palmer", "Cieran Slicker"],
                def: ["Harry Clarke", "Leif Davis", "Darnell Furlong", "Jacob Greaves", "Ben Johnson", "Cédric Kipré", "Dara O'Shea", "Elkan Baggott", "Abdoul Ouattara"],
                mid: ["Azor Matusiwa", "Cameron Humphreys", "Jack Taylor", "Marcelino Núñez", "Wes Burns", "Chiedozie Ogbene", "Sam Szmodics", "Julio Enciso"],
                fwd: ["George Hirst", "Chuba Akpom", "Ali Al-Hamadi", "Jaden Philogene", "Kasey McAteer", "Anis Mehmeti", "Sindre Walle Egeli", "Jack Clarke"]
            },
            {
                name: "Paris FC",
                td: "Liam Rosenior",
                logoBg: "linear-gradient(135deg, #1e3799, #00d2d3)",
                logoCode: "PFC",
                gk: ["Obed Nkambadio", "Kevin Trapp"],
                def: ["Otávio", "Tuomas Ollila", "Thibault De Smet", "Nhoa Sangui", "Moustapha Mbow", "Samir Chergui", "Hamari Traoré"],
                mid: ["Vincent Marchetti", "Adama Camara", "Mathieu Cafaro", "Pierre Lees-Melou", "Maxime Lopez", "Ilan Kebbal", "Rudy Matondo"],
                fwd: ["Jean-Philippe Krasso", "Alimami Gory", "Willem Geubbels", "Jonathan Ikoné", "Moses Simon", "Luca Koleosho", "Ciro Immobile"]
            },
            {
                name: "Getafe",
                td: "José Bordalás",
                logoBg: "linear-gradient(135deg, #0984e3, #00d2d3)",
                logoCode: "GET",
                gk: ["David Soria", "Jiří Letáček"],
                def: ["Abdel Abqar", "Djene Dakonam", "J. Ives Valou", "Davinchi", "Juan Berrocal", "Andrés García", "Boselli", "Zaid Romero", "Kiko Femenía", "Ismael Bekhoucha"],
                mid: ["Javi Muñoz", "Mario Martín", "Christantus Uche", "Ramón Terrats", "Yvan Neyou", "Coba da Costa"],
                fwd: ["Juanmi", "Peter Federico", "Álex Sancris", "Borja Mayoral", "Martín Satriano"]
            },
            {
                name: "1. FC Köln",
                td: "René Wagner",
                logoBg: "linear-gradient(135deg, #d63031, #ffffff)",
                logoCode: "KOE",
                gk: ["Marvin Schwäbe", "Ron-Robert Zieler", "Matthias Köbbing"],
                def: ["Jahmai Simpson-Pusey", "Rav van den Berg", "Joël Schmied", "Julian Pauli", "Luka Lochoshvili", "Timo Hübers", "Elias Bakatukanda", "Sebastian Sebulonsen", "Jusuf Gazibegovic"],
                mid: ["Tom Krauß", "Fayssal Harchaoui", "Ísak Jóhannesson", "Said El Mala", "Jan Thielmann", "Linton Maina", "Jakub Kamiński", "Florian Kainz", "Denis Huseinbasic"],
                fwd: ["Ragnar Ache", "Marius Bülter", "Luca Waldschmidt", "Youssoupha Niang", "Imad Rondić", "Malek El Mala", "Fynn Schenten", "Thijs Dallinga"]
            },
            {
                name: "Fiorentina",
                td: "Fabio Grosso",
                logoBg: "linear-gradient(135deg, #6c5ce7, #a29bfe)",
                logoCode: "FIO",
                gk: ["David De Gea", "Pietro Terracciano", "Tommaso Martinelli"],
                def: ["Dodô", "Michael Kayode", "Robin Gosens", "Fabiano Parisi", "Luca Ranieri", "Marin Pongračić", "Matías Moreno", "Nicolás Valentini", "Pietro Comuzzo"],
                mid: ["Rolando Mandragora", "Danilo Cataldi", "Cher Ndour", "Arthur Atta", "Hans Nicolussi Caviglia", "Edoardo Bove", "Alessandro Bianco"],
                fwd: ["Moise Kean", "Albert Gudmundsson", "Riccardo Sottil", "M'Bala Nzola", "Mateo Pellegrino", "Franco Mastantuono"]
            }
        ];

        let playerName = "";

        function startPlayerCareer() {
            const nameInput = document.getElementById("player-name").value.trim();
            if (nameInput === "") {
                alert("Lütfen bir futbolcu adı girin!");
                return;
            }

            playerName = nameInput;
            document.getElementById("display-name").innerText = playerName;

            document.getElementById("login-section").style.display = "none";
            document.getElementById("offers-section").style.display = "block";

            loadOffers();
        }

        function loadOffers() {
            const container = document.getElementById("clubs-container");
            container.innerHTML = "";

            clubs.forEach((club, index) => {
                const totalPlayers = club.gk.length + club.def.length + club.mid.length + club.fwd.length;
                const card = document.createElement("div");
                card.className = "club-card";
                card.innerHTML = `
                    <div class="club-logo" style="background: ${club.logoBg}">${club.logoCode}</div>
                    <div class="club-name">${club.name}</div>
                    <div class="club-info">
                        <strong>Teknik Direktör:</strong> ${club.td}<br>
                        <strong>Kadro Genişliği:</strong> ${totalPlayers} Oyuncu<br>
                        <strong>Öne Çıkanlar:</strong> ${club.fwd[0]}, ${club.mid[0]}
                    </div>
                    
                    <button class="btn" style="width: 100%; margin-bottom: 8px;" onclick="signContract(${index})">İmzayı At</button>
                    <button class="btn" style="width: 100%; background-color: #63cdda;" onclick="toggleSquad(${index})">Kadroyu İncele</button>
                    
                    <div class="squad-box" id="squad-${index}">
                        <strong>Kaleciler:</strong> ${club.gk.join(", ")}<br><br>
                        <strong>Defans:</strong> ${club.def.join(", ")}<br><br>
                        <strong>Orta Saha:</strong> ${club.mid.join(", ")}<br><br>
                        <strong>Forvet:</strong> ${club.fwd.join(", ")}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function toggleSquad(index) {
            const box = document.getElementById(`squad-${index}`);
            if (box.style.display === "block") {
                box.style.display = "none";
            } else {
                box.style.display = "block";
            }
        }

        function signContract(index) {
            const chosen = clubs[index];
            document.getElementById("offers-section").style.display = "none";
            document.getElementById("game-dashboard").style.display = "block";

            document.getElementById("selected-club-info").innerHTML = `
                <div class="club-logo" style="background: ${chosen.logoBg}; width:90px; height:90px; font-size:1.8rem; margin-bottom:15px;">${chosen.logoCode}</div>
                <h3 style="font-size: 2rem; color: #008b8b;">${chosen.name}</h3>
                <p style="margin: 12px 0; color: #333; font-size: 1.1rem;">
                    Tebrikler <strong>${playerName}</strong>! <strong>${chosen.name}</strong> ile resmi sözleşmeyi imzaladın.
                </p>
                <hr style="border: 1px solid #e0ffff; margin: 15px 0;">
                <p><strong>Teknik Direktörün:</strong> ${chosen.td}</p>
                <p><strong>Yeni Takım Arkadaşların:</strong> ${chosen.fwd[0]}, ${chosen.mid[0]}, ${chosen.gk[0]}</p>
                <br>
                <p style="color: #00a8a8; font-weight: bold;">(Sonraki adımda maça çıkma, forma numarası seçme ve antrenman modlarını ekleyeceğiz!)</p>
            `;
        }
    </script>
</body>
</html>
